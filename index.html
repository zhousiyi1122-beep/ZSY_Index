<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12161A">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<style>
  :root{
    --ink:#E9E7DF;
    --ink-dim:#9CA3A0;
    --bg:#12161A;
    --surface:#1B2126;
    --surface-2:#222A30;
    --line:#2E373E;
    --money:#4FA88A;
    --money-dim:#2F5F4E;
    --pending:#E8A33D;
    --alert:#D9635C;
    --accent:#7FB8A3;
    --radius:10px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:76px;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}
  h1,h2,h3{font-family:'IBM Plex Sans',sans-serif;font-weight:600;margin:0;}
  a{color:inherit;}

  .topbar{
    background:linear-gradient(180deg,#1A2024,#151A1E);
    border-bottom:1px solid var(--line);
    padding:18px 18px 16px;
    position:sticky;top:0;z-index:10;
  }
  .topbar .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-dim);margin-bottom:6px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--money);display:inline-block;margin-right:5px;}
  .sync-dot.bad{background:var(--alert);}
  .sync-dot.busy{background:var(--pending);}
  .topbar .balance-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .topbar .balance{font-size:22px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:-0.5px;}
  .topbar .balance.neg{color:var(--alert);}
  .topbar .balance-label{font-size:12px;color:var(--ink-dim);}
  .topbar .sub-stats{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap;}
  .stat-chip{font-size:12px;color:var(--ink-dim);}
  .stat-chip b{color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .stat-chip.warn b{color:var(--pending);}
  .stat-chip.bad b{color:var(--alert);}

  main{padding:16px 14px 20px;max-width:640px;margin:0 auto;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card-title{
    font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-dim);margin-bottom:12px;font-family:'IBM Plex Mono',monospace;
  }

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .metric{background:var(--surface-2);border-radius:8px;padding:12px;}
  .metric .v{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;}
  .metric .l{font-size:11px;color:var(--ink-dim);margin-top:2px;}

  .catbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}
  .catbar-row .name{width:96px;flex:0 0 96px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .catbar-track{flex:1;background:var(--surface-2);border-radius:4px;height:8px;overflow:hidden;}
  .catbar-fill{height:100%;background:var(--accent);border-radius:4px;}
  .catbar-row .amt{font-family:'IBM Plex Mono',monospace;width:64px;text-align:right;flex:0 0 64px;}

  label{display:block;font-size:12px;color:var(--ink-dim);margin:14px 0 6px;letter-spacing:.02em;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:11px 12px;font-size:15px;font-family:inherit;
  }
  input.mono,input[type=number],input[type=date]{font-family:'IBM Plex Mono',monospace;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent;}
  .pill-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
  .pill{
    padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);
    font-size:13px;cursor:pointer;color:var(--ink-dim);
  }
  .pill.active{background:var(--accent);color:#0F1418;border-color:var(--accent);font-weight:600;}
  .btn{
    width:100%;padding:13px;border-radius:8px;border:none;background:var(--accent);color:#0F1418;
    font-weight:600;font-size:15px;margin-top:18px;cursor:pointer;
  }
  .btn:active{opacity:.85;}
  .btn:disabled{opacity:.5;}
  .btn.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn.danger{background:transparent;color:var(--alert);border:1px solid var(--alert);}
  .row-flex{display:flex;gap:10px;}
  .row-flex .btn{margin-top:0;}
  .helptext{font-size:11.5px;color:var(--ink-dim);margin-top:6px;line-height:1.4;}

  .txn-item{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:12px 0;border-bottom:1px solid var(--line);gap:10px;
  }
  .txn-item:last-child{border-bottom:none;}
  .txn-left .vendor{font-size:14.5px;font-weight:600;}
  .txn-left .meta{font-size:12px;color:var(--ink-dim);margin-top:3px;}
  .tag{
    display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:10px;
    background:var(--surface-2);color:var(--ink-dim);margin-right:5px;font-family:'IBM Plex Mono',monospace;
  }
  .txn-right{text-align:right;flex:0 0 auto;}
  .txn-right .amt{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;}
  .txn-right .rec{font-size:10.5px;margin-top:4px;}
  .rec.yes{color:var(--money);}
  .rec.no{color:var(--pending);}
  .day-heading{
    font-size:11px;color:var(--ink-dim);letter-spacing:.08em;text-transform:uppercase;
    font-family:'IBM Plex Mono',monospace;margin:18px 0 4px;
  }
  .day-heading:first-child{margin-top:0;}
  .empty{color:var(--ink-dim);font-size:13.5px;padding:24px 0;text-align:center;}

  .period-card{border:1px solid var(--line);border-radius:8px;padding:13px;margin-bottom:12px;background:var(--surface-2);}
  .period-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .period-head .title{font-weight:600;font-size:14px;}
  .status-badge{font-size:10.5px;padding:3px 8px;border-radius:10px;font-family:'IBM Plex Mono',monospace;}
  .status-badge.closed{background:var(--money-dim);color:var(--money);}
  .status-badge.open{background:#3A331F;color:var(--pending);}
  .recon-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;}
  .recon-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--money);flex:0 0 auto;}
  .recon-row .rv{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .recon-row .ra{font-family:'IBM Plex Mono',monospace;flex:0 0 auto;}
  .variance{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .variance-ok{color:var(--money);}
  .variance-bad{color:var(--alert);}

  .list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .row-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;align-self:flex-start;}
  .list-row .n{font-size:14px;}
  .list-row .m{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
  .x-btn{background:none;border:none;color:var(--alert);font-size:18px;cursor:pointer;padding:4px 8px;}
  .chip-add{display:flex;gap:8px;margin-top:12px;}
  .chip-add input{flex:1;}
  .chip-add button{flex:0 0 auto;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:13px;}

  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    background:#151A1E;border-top:1px solid var(--line);
    display:flex;z-index:20;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-btn{
    flex:1;background:none;border:none;color:var(--ink-dim);padding:11px 4px 9px;
    font-size:10.5px;font-family:'IBM Plex Sans',sans-serif;letter-spacing:.02em;
    display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  }
  .nav-btn svg{width:20px;height:20px;stroke:var(--ink-dim);}
  .nav-btn.active{color:var(--accent);}
  .nav-btn.active svg{stroke:var(--accent);}

  .toast{
    position:fixed;bottom:86px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:#0F1418;padding:10px 18px;border-radius:20px;
    font-size:13px;font-weight:600;z-index:30;opacity:0;pointer-events:none;
    transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .toast.error{background:var(--alert);color:#fff;}

  .setup-screen{padding:40px 20px;max-width:480px;margin:0 auto;}
  .setup-screen ol{padding-left:20px;font-size:14px;line-height:1.7;color:var(--ink-dim);}
  .setup-screen code{background:var(--surface-2);padding:1px 6px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="eyebrow"><span><span class="sync-dot" id="sync-dot"></span><span id="sync-label">Ledger — Daily Transaction Log</span></span></div>
  <div class="balance-row">
    <span class="balance mono" id="hdr-balance">$0.00</span>
    <span class="balance-label" id="hdr-balance-label">balance</span>
  </div>
  <div class="sub-stats" id="hdr-substats"></div>
</div>

<main id="view"></main>

<div class="toast" id="toast"></div>

<nav class="bottom-nav" id="bottom-nav" style="display:none;">
  <button class="nav-btn" data-view="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
    Dashboard
  </button>
  <button class="nav-btn" data-view="add">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
    Add
  </button>
  <button class="nav-btn" data-view="log">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    Log
  </button>

    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    Reconcile
  </button>
  <button class="nav-btn" data-view="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.13.36.35.68.63.94"/></svg>
    Settings
  </button>
</nav>

<script>
/* ============================================================
   CONFIG — the Apps Script web app URL is entered in-app (setup
   screen on first run, or Settings > Data source afterwards) and
   kept in this browser's localStorage. Nothing to edit in source.
   ============================================================ */
let API_URL = localStorage.getItem('ledger_api_url') || '';

function setApiUrl(url){
  API_URL = url.trim();
  if(API_URL) localStorage.setItem('ledger_api_url', API_URL);
  else localStorage.removeItem('ledger_api_url');
}

/* ============ State ============ */
let state = { transactions: [], merchants: [], settings: null };
let currentView = 'dashboard';
let apiReady = false;
let editingMerchantId = null;
let editingCategory = null;
let editingMethod = null;
let editingCardId = null;
let editingAccountId = null;
let editingGiftCardId = null;
let editingScheduleId = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============ Cards ============ */
function getCards(){ return state.settings.cards || []; }
function findCard(name){ return getCards().find(c=>c.name===name); }
function isCardMethod(name){ return !!findCard(name); }
function allPaymentMethodOptions(){ return [...(state.settings.paymentMethods||[]), ...getCards().map(c=>c.name), ...getAccounts().map(a=>a.name), ...getGiftCards().map(g=>g.name)]; }

/* ============ Bank / savings accounts ============ */
function getAccounts(){ return state.settings.accounts || []; }
function findAccount(name){ return getAccounts().find(a=>a.name===name); }
function accountBalance(a){
  const openingDate = a.openingBalanceDate || '1970-01-01';
  const spent = state.transactions
    .filter(t => t.date >= openingDate && t.paymentMethod === a.name)
    .reduce((sum,t) => sum + t.amount, 0);
  return Number(a.openingBalance||0) - spent;
}
function totalAccountsBalance(){
  return getAccounts().reduce((sum,a)=> sum + accountBalance(a), 0);
}

/* ============ Gift cards ============ */
// Loading a gift card is a transfer (money moves from a credit card into
// prepaid value) — not a spend, so its transaction is filed under a fixed
// "Gift Cards Loaded" category. Redeeming it — picking the gift card as
// the payment method on a normal transaction — is the real expense.
const GIFT_CARD_LOAD_CATEGORY = 'Gift Cards Loaded';
function getGiftCards(){ return state.settings.giftCards || []; }
function findGiftCard(name){ return getGiftCards().find(g=>g.name===name); }
function isGiftCardMethod(name){ return !!findGiftCard(name); }
function giftCardBalance(g){
  const redeemed = state.transactions
    .filter(t => t.paymentMethod === g.name)
    .reduce((sum,t) => sum + t.amount, 0);
  return Number(g.loadedAmount||0) - redeemed;
}
function giftCardTag(t){
  if(t.category === GIFT_CARD_LOAD_CATEGORY) return `<span class="tag" style="color:var(--accent);">Gift card loaded</span>`;
  if(isGiftCardMethod(t.paymentMethod)) return `<span class="tag" style="color:var(--accent);">Gift card redemption</span>`;
  return '';
}
// Same full, live list as Transfer money — any current payment method
// except Afterpay (its 4-installment split doesn't fit a single amount).
function giftCardFundingOptions(){
  return allPaymentMethodOptions().filter(m => m !== 'Afterpay');
}
// Categories used automatically by Transfers/Gift Cards are left out of
// the manual picker — they still exist in Settings and still work, just
// aren't offered as something to hand-pick for an ordinary purchase.
function manualCategoryOptions(){
  return (state.settings.categories||[]).filter(c => c !== TRANSFER_CATEGORY && c !== GIFT_CARD_LOAD_CATEGORY);
}

/* ============ Transfers ============ */
// Moving money between payment methods isn't a spend, so it's filed under a
// fixed category and kept out of the real spend breakdown. Only sides that
// actually track a balance (an account, a card, or a gift card) get a
// transaction — Cash, Debit Card, and Bank Transfer have no ledger of
// their own, so nothing is recorded on that side.
const TRANSFER_CATEGORY = 'Internal Transfer';
function transferMethodOptions(){
  return allPaymentMethodOptions().filter(m => m !== 'Afterpay');
}
function hasLedger(name){
  return !!(findAccount(name) || findCard(name) || isGiftCardMethod(name));
}
async function ensureTransferCategory(){
  if((state.settings.categories||[]).includes(TRANSFER_CATEGORY)) return;
  const categories = [...(state.settings.categories||[]), TRANSFER_CATEGORY];
  const data = await apiPost('saveSettings', { data: { categories } });
  applyData(data);
}

/* ============ Scheduled payments ============ */
function getSchedules(){ return state.settings.schedules || []; }
function scheduleMethodOptions(){ return allPaymentMethodOptions().filter(m=>m!=='Afterpay'); }
function frequencyLabel(f){ return f==='weekly' ? 'Weekly' : f==='fortnightly' ? 'Fortnightly' : 'Monthly'; }

// Afterpay's real schedule: 4 equal payments, 14 days apart, starting on
// the purchase date. Any odd cent from the split lands on the last payment.
function afterpayInstallments(total, startDate){
  const cents = Math.round(total*100);
  const base = Math.floor(cents/4);
  const remainder = cents - base*4;
  const amounts = [base,base,base,base];
  for(let i=0;i<remainder;i++) amounts[3-i] += 1;
  return amounts.map((c,i)=>{
    const d = new Date(startDate+'T00:00:00');
    d.setDate(d.getDate() + i*14);
    const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    return { date: dateStr, amount: c/100 };
  });
}

function afterpayTag(notes){
  const m = /Afterpay installment (\d+) of (\d+)/.exec(notes||'');
  return m ? `<span class="tag" style="color:var(--pending);">Afterpay ${m[1]}/${m[2]}</span>` : '';
}

// Groups the 4 installment transactions of one Afterpay purchase back
// together, so the dashboard can show what's still owed on it. New
// purchases carry a hidden [apg:ID] token in their notes; older ones
// (logged before this existed) fall back to matching on vendor + the
// purchase date/total that's already written into the notes text.
function afterpayGroupKey(t){
  const tagged = /\[apg:([a-z0-9]+)\]/.exec(t.notes||'');
  if(tagged) return 'apg:'+tagged[1];
  const legacy = /Afterpay installment \d+ of \d+ \(purchased (\d{4}-\d{2}-\d{2}), total (.+?)\)/.exec(t.notes||'');
  if(legacy) return 'legacy:'+t.vendor+'|'+legacy[1]+'|'+legacy[2];
  return null;
}

function afterpayGroups(){
  const groups = {};
  state.transactions.forEach(t=>{
    const key = afterpayGroupKey(t);
    if(!key) return;
    (groups[key] = groups[key] || { vendor: t.vendor, installments: [] }).installments.push(t);
  });
  const today = todayStr();
  return Object.values(groups).map(g=>{
    g.installments.sort((a,b)=>a.date.localeCompare(b.date));
    const total = g.installments.reduce((s,t)=>s+t.amount,0);
    const remaining = g.installments.filter(t=>t.date > today).reduce((s,t)=>s+t.amount,0);
    const nextInstallment = g.installments.find(t=>t.date > today) || null;
    return { vendor: g.vendor, total, remaining, nextInstallment, installments: g.installments };
  })
  .filter(g => g.remaining > 0.001)
  .sort((a,b) => (a.nextInstallment?a.nextInstallment.date:'9999-99-99').localeCompare(b.nextInstallment?b.nextInstallment.date:'9999-99-99'));
}

function totalAfterpayOutstanding(){
  return afterpayGroups().reduce((s,g)=>s+g.remaining,0);
}

function scheduledTag(notes){
  return /\(scheduled payment\)/.test(notes||'') ? `<span class="tag" style="color:var(--accent);">Scheduled</span>` : '';
}

// One-off migration: older data had a single "Credit Card" payment method
// with one shared closing day / limit. Turn that into a proper card entry.
async function migrateLegacyCardIfNeeded(){
  if(state.settings.cards !== undefined) return;
  const legacyMethods = state.settings.paymentMethods || [];
  const hadLegacyCard = legacyMethods.includes('Credit Card');
  const cards = hadLegacyCard ? [{
    id: uid(),
    name: 'Credit Card',
    closingDay: state.settings.closingDay || 15,
    creditLimit: state.settings.creditLimit!==undefined ? state.settings.creditLimit : null
  }] : [];
  const paymentMethods = legacyMethods.filter(m=>m!=='Credit Card');
  const data = await apiPost('saveSettings', { data: { cards, paymentMethods } });
  applyData(data);
}

// One-off migration: the old single global opening balance (optionally
// scoped to one payment method) becomes a proper bank account entry.
async function migrateLegacyAccountIfNeeded(){
  if(state.settings.accounts !== undefined) return;
  const accountName = state.settings.openingBalanceMethod || 'Bank Transfer';
  const accounts = [{
    id: uid(),
    name: accountName,
    openingBalance: Number(state.settings.openingBalance||0),
    openingBalanceDate: state.settings.openingBalanceDate || todayStr()
  }];
  const paymentMethods = (state.settings.paymentMethods||[]).filter(m=>m!==accountName);
  const data = await apiPost('saveSettings', { data: { accounts, paymentMethods } });
  applyData(data);
}

/* ============ API layer (Google Sheets via Apps Script) ============ */
function setSync(status){ // 'ok' | 'busy' | 'bad'
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if(!dot) return;
  dot.className = 'sync-dot' + (status==='bad'?' bad':status==='busy'?' busy':'');
  label.textContent = status==='bad' ? 'Ledger — sync error' : status==='busy' ? 'Ledger — syncing…' : 'Ledger — Daily Transaction Log';
}

async function apiGet(){
  const res = await fetch(API_URL, { method:'GET' });
  if(!res.ok) throw new Error('GET failed: ' + res.status);
  return res.json();
}

async function apiPost(action, extra){
  setSync('busy');
  const res = await fetch(API_URL, {
    method:'POST',
    // text/plain avoids a CORS preflight against Apps Script, which doesn't handle OPTIONS
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action }, extra))
  });
  if(!res.ok) throw new Error('POST failed: ' + res.status);
  const data = await res.json();
  setSync('ok');
  return data;
}

async function refreshFromApi(){
  const data = await apiGet();

}

}

/* ============ Formatting helpers ============ */
function fmtMoney(n){
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtDate(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
}
function fmtDateShort(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ============ Statement period logic ============ */
function periodEndFor(dateStr, closingDay){
  const d = new Date(dateStr + 'T00:00:00');
  const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  const lastDayThisMonth = new Date(y, m+1, 0).getDate();
  const cd = Math.min(closingDay, lastDayThisMonth);
  let end = new Date(y, m, cd);
  if(day > cd){
    const nm = new Date(y, m+1, 1);
    const lastDayNext = new Date(nm.getFullYear(), nm.getMonth()+1, 0).getDate();
    end = new Date(nm.getFullYear(), nm.getMonth(), Math.min(closingDay, lastDayNext));
  }
  return end;
}
function periodKeyFor(dateStr, closingDay){
  const end = periodEndFor(dateStr, closingDay);
  return end.getFullYear()+'-'+String(end.getMonth()+1).padStart(2,'0')+'-'+String(end.getDate()).padStart(2,'0');
}
function periodStartFromEnd(endDate){
  const start = new Date(endDate);
  start.setMonth(start.getMonth()-1);
  start.setDate(start.getDate()+1);
  return start;
}
function periodLabel(endKey){
  const end = new Date(endKey + 'T00:00:00');
  const start = periodStartFromEnd(end);
  const opts = {day:'numeric',month:'short'};
  return start.toLocaleDateString('en-AU',opts) + ' \u2013 ' + end.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
}

/* ============ Merchant helpers ============ */
function findMerchant(name){
  const n = name.trim().toLowerCase();
  return state.merchants.find(m => m.name.toLowerCase() === n);
}
async function upsertMerchantFromEntry(name, category, paymentMethod){
  if(!name.trim()) return;
  if(findMerchant(name)) return;
  const data = await apiPost('addMerchant', { data: { name: name.trim(), category, paymentMethod } });
  applyData(data);
}

/* ============ Header (balance + close countdown) ============ */
function renderHeader(){
  const accounts = getAccounts();
  const balance = totalAccountsBalance();
  const balEl = document.getElementById('hdr-balance');
  balEl.textContent = fmtMoney(balance);
  balEl.classList.toggle('neg', balance < 0);
  document.getElementById('hdr-balance-label').textContent =
    accounts.length === 0 ? 'no accounts set up' :
    accounts.length === 1 ? `${escapeHtml(accounts[0].name)} balance` :
    `combined balance \u00b7 ${accounts.length} accounts`;

  const now = todayStr();
  const cards = getCards();
  const cardStats = cards.map(c=>{
    const key = periodKeyFor(now, c.closingDay||15);
    const end = periodEndFor(now, c.closingDay||15);
    const daysLeft = Math.round((end - new Date(now+'T00:00:00')) / 86400000);
    const spend = state.transactions.filter(t => t.paymentMethod===c.name && periodKeyFor(t.date, c.closingDay||15)===key)
      .reduce((s,t)=>s+t.amount,0);
    return { card:c, key, daysLeft, spend };
  });
  const unreconciled = state.transactions.filter(t => isCardMethod(t.paymentMethod) && !t.reconciled).length;

  let statsHtml = '';
  if(cardStats.length){
    // Lead with whichever card closes soonest.
    const soonest = [...cardStats].sort((a,b)=>a.daysLeft-b.daysLeft)[0];
    statsHtml += `<div class="stat-chip"><b>${fmtMoney(soonest.spend)}</b> ${escapeHtml(soonest.card.name)} statement</div>`;
    statsHtml += `<div class="stat-chip${soonest.daysLeft<=3?' warn':''}"><b>${soonest.daysLeft}d</b> to close (${fmtDate(soonest.key)})</div>`;
    if(cardStats.length>1) statsHtml += `<div class="stat-chip">${cardStats.length} cards</div>`;
    if(soonest.card.creditLimit){
      const over = soonest.spend > soonest.card.creditLimit;
      statsHtml += `<div class="stat-chip${over?' bad':''}"><b>${fmtMoney(soonest.card.creditLimit - soonest.spend)}</b> ${escapeHtml(soonest.card.name)} headroom</div>`;
    }
  }
  if(unreconciled>0) statsHtml += `<div class="stat-chip warn"><b>${unreconciled}</b> unreconciled</div>`;
  const apOutstanding = totalAfterpayOutstanding();
  if(apOutstanding>0.001) statsHtml += `<div class="stat-chip"><b>${fmtMoney(apOutstanding)}</b> Afterpay owing</div>`;
  document.getElementById('hdr-substats').innerHTML = statsHtml;
}

/* ============ Dashboard ============ */
function viewDashboard(){
  const now = todayStr();
  const cards = getCards();
  // Internal transfers move money between your own accounts/cards — not a
  // real expense — so they're kept out of both spend widgets below. They
  // still count normally toward account balances, card statements, and
  // reconciliation, which is computed separately from this.
  const monthTxns = state.transactions.filter(t => t.date.slice(0,7) === now.slice(0,7) && t.category !== TRANSFER_CATEGORY);
  const methodList = allPaymentMethodOptions();
  const byMethod = {};
  methodList.forEach(m => byMethod[m] = 0);
  monthTxns.forEach(t => byMethod[t.paymentMethod] = (byMethod[t.paymentMethod]||0) + t.amount);

  const byCat = {};
  monthTxns.forEach(t => byCat[t.category] = (byCat[t.category]||0) + t.amount);
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat = catEntries.length ? catEntries[0][1] : 1;

  let methodCards = methodList.map(m => `
    <div class="metric">
      <div class="v">${fmtMoney(byMethod[m]||0)}</div>
      <div class="l">${escapeHtml(m)}</div>
    </div>`).join('');

  let catBars = catEntries.length ? catEntries.map(([cat,amt])=>`
    <div class="catbar-row">
      <div class="name">${escapeHtml(cat)}</div>
      <div class="catbar-track"><div class="catbar-fill" style="width:${Math.max(4,(amt/maxCat*100))}%"></div></div>
      <div class="amt">${fmtMoney(amt)}</div>
    </div>`).join('') : `<div class="empty">No transactions logged this month yet.</div>`;

  const cardSections = cards.map(c=>{
    const key = periodKeyFor(now, c.closingDay||15);
    const spend = state.transactions.filter(t=>t.paymentMethod===c.name && periodKeyFor(t.date, c.closingDay||15)===key)
      .reduce((s,t)=>s+t.amount,0);
    const periodRec = ((state.settings.periods||{})[c.id]||{})[key];
    return `
      <div class="card">
        <div class="card-title">${escapeHtml(c.name)} — current statement</div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-size:14px;font-weight:600;">${periodLabel(key)}</div>
            <div class="helptext" style="margin-top:4px;">Closes ${fmtDate(key)}</div>
          </div>
          <div class="mono" style="font-size:18px;font-weight:600;">${fmtMoney(spend)}</div>
        </div>
        ${c.creditLimit ? `<div class="helptext" style="margin-top:8px;">${fmtMoney(c.creditLimit - spend)} of ${fmtMoney(c.creditLimit)} limit remaining</div>` : ''}
        ${periodRec && periodRec.closed ? `<div class="helptext" style="color:var(--money);margin-top:8px;">Reconciled against statement of ${fmtMoney(periodRec.actualTotal)}</div>` : ''}
      </div>`;
  }).join('');

  const accountSections = getAccounts().map(a=>{
    const bal = accountBalance(a);
    return `
      <div class="card">
        <div class="card-title">${escapeHtml(a.name)}</div>
        <div class="mono" style="font-size:18px;font-weight:600;${bal<0?'color:var(--alert);':''}">${fmtMoney(bal)}</div>
        <div class="helptext">Opening balance ${fmtMoney(Number(a.openingBalance||0))} on ${fmtDate(a.openingBalanceDate||now)}, minus everything logged to ${escapeHtml(a.name)} since. Change this in Settings.</div>
      </div>`;
  }).join('') || `<div class="card"><div class="empty">No bank accounts set up yet. Add one in Settings → Bank accounts to track a running balance.</div></div>`;

  const giftCardSections = getGiftCards().length ? `
    <div class="card">
      <div class="card-title">Gift cards</div>
      ${getGiftCards().map(g=>{
        const bal = giftCardBalance(g);
        return `
          <div class="metric" style="margin-bottom:10px;">
            <div class="v">${fmtMoney(bal)}</div>
            <div class="l">${escapeHtml(g.name)} \u00b7 loaded ${fmtMoney(g.loadedAmount)} via ${escapeHtml(g.cardName)}</div>
          </div>`;
      }).join('')}
    </div>` : '';

  const afterpaySection = afterpayGroups().length ? `
    <div class="card">
      <div class="card-title">Afterpay — still owing</div>
      ${afterpayGroups().map(g=>`
        <div class="metric" style="margin-bottom:10px;">
          <div class="v">${fmtMoney(g.remaining)}</div>
          <div class="l">${escapeHtml(g.vendor)} \u00b7 ${g.nextInstallment ? `next ${fmtMoney(g.nextInstallment.amount)} on ${fmtDate(g.nextInstallment.date)} via ${escapeHtml(g.nextInstallment.paymentMethod)}` : 'fully charged'}</div>
        </div>`).join('')}
    </div>` : '';

  return `
    ${accountSections}
    ${afterpaySection}
    <div class="card">
      <div class="card-title">Spend by payment method — this month</div>
      <div class="grid-2">${methodCards}</div>
    </div>
    <div class="card">
      <div class="card-title">Spend by category — this month</div>
      ${catBars}
    </div>
    ${cardSections}
    ${giftCardSections}
  `;
}

  let html = '<div class="card">';

      html += `<div class="day-heading">${fmtDateShort(t.date)}</div>`;

/* ============ Reconcile ============ */
function viewReconcile(){
  const cards = getCards();
  if(!cards.length){
    return `<div class="card"><div class="empty">No credit cards set up yet. Add one in Settings → Credit cards, then log some transactions against it to reconcile.</div></div>`;
  }

  return cards.map(card=>{
    const closingDay = card.closingDay || 15;
    const cardTxns = state.transactions.filter(t => t.paymentMethod === card.name);
    if(!cardTxns.length){
      return `
        <div class="card">
          <div class="card-title">${escapeHtml(card.name)}</div>
          <div class="empty">No transactions logged against this card yet.</div>
        </div>`;
    }
    const periods = {};
    cardTxns.forEach(t=>{
      const key = periodKeyFor(t.date, closingDay);
      (periods[key] = periods[key] || []).push(t);
    });
    const keys = Object.keys(periods).sort().reverse();

    const periodsHtml = keys.map(key=>{
      const txns = periods[key].sort((a,b)=>a.date.localeCompare(b.date));
      const total = txns.reduce((s,t)=>s+t.amount,0);
      const recCount = txns.filter(t=>t.reconciled).length;
      const pr = ((state.settings.periods||{})[card.id]||{})[key];
      const closed = pr && pr.closed;
      const actual = pr ? pr.actualTotal : null;
      const pid = card.id + '__' + key;
      return `
        <div class="period-card" data-card="${card.id}" data-period="${key}">
          <div class="period-head">
            <div class="title">${periodLabel(key)}</div>
            <div class="status-badge ${closed?'closed':'open'}">${closed?'closed':'open'}</div>
          </div>
          <div class="helptext">${recCount}/${txns.length} matched \u2014 logged total ${fmtMoney(total)}</div>
          ${txns.map(t=>`
            <div class="recon-row">
              <input type="checkbox" class="recon-check" data-id="${t.id}" ${t.reconciled?'checked':''}>
              <div class="rv">${escapeHtml(t.vendor)} \u00b7 ${fmtDate(t.date)}</div>
              <div class="ra mono">${fmtMoney(t.amount)}</div>
            </div>
          `).join('')}
          <div class="variance">
            <label for="actual-${pid}" style="margin:0 0 6px;">Actual statement total</label>
            <input type="number" step="0.01" class="mono actual-input" id="actual-${pid}" data-card="${card.id}" data-period="${key}" placeholder="Enter amount from statement" value="${actual!==null && actual!==undefined ? actual : ''}">
            <div id="variance-${pid}" class="helptext" style="margin-top:8px;"></div>
            <button type="button" class="btn secondary close-period-btn" data-card="${card.id}" data-period="${key}" style="margin-top:12px;">${closed?'Reopen period':'Mark statement reconciled'}</button>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="card-title" style="margin:4px 0 -2px 2px;">${escapeHtml(card.name)}</div>
      ${periodsHtml}
    `;
  }).join('');
}

function updateVarianceDisplay(cardId, key){
  const pid = cardId + '__' + key;
  const input = document.getElementById('actual-'+pid);
  const disp = document.getElementById('variance-'+pid);
  if(!input || !disp) return;
  const card = getCards().find(c=>c.id===cardId);
  const closingDay = card ? (card.closingDay||15) : 15;
  const txns = state.transactions.filter(t=>t.paymentMethod===(card?card.name:null) && periodKeyFor(t.date,closingDay)===key);
  const total = txns.reduce((s,t)=>s+t.amount,0);
  const actual = parseFloat(input.value);
  if(isNaN(actual)){ disp.textContent=''; return; }
  const diff = actual - total;
  if(Math.abs(diff) < 0.01){
    disp.innerHTML = `<span class="variance-ok">Matches \u2014 logged total agrees with statement.</span>`;
  } else {
    disp.innerHTML = `<span class="variance-bad">Variance of ${fmtMoney(Math.abs(diff))} \u2014 statement is ${diff>0?'higher':'lower'} than logged transactions.</span>`;
  }
}

/* ============ Escaping ============ */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

/* ============ Event handling per view ============ */
function attachHandlers(){
  if(currentView === 'add'){
    document.querySelectorAll('#f-method-group .pill').forEach(p=>{
      p.addEventListener('click', ()=>{
        document.querySelectorAll('#f-method-group .pill').forEach(x=>x.classList.remove('active'));
        p.classList.add('active');
        const section = document.getElementById('afterpay-section');
        if(section) section.style.display = (p.dataset.value === 'Afterpay') ? 'block' : 'none';
      });
    });
    document.querySelectorAll('#f-category-group .pill').forEach(p=>{
      p.addEventListener('click', ()=>{
        document.querySelectorAll('#f-category-group .pill').forEach(x=>x.classList.remove('active'));
        p.classList.add('active');
      });
    });
    const vendorInput = document.getElementById('f-vendor');
    vendorInput.addEventListener('change', ()=>{
      const m = findMerchant(vendorInput.value);
      if(m){
        document.querySelectorAll('#f-method-group .pill').forEach(x=>x.classList.toggle('active', x.dataset.value===m.paymentMethod));
        document.querySelectorAll('#f-category-group .pill').forEach(x=>x.classList.toggle('active', x.dataset.value===m.category));
        const section = document.getElementById('afterpay-section');
        if(section) section.style.display = (m.paymentMethod === 'Afterpay') ? 'block' : 'none';
      }
    });
    document.getElementById('add-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const date = document.getElementById('f-date').value;
      const vendor = document.getElementById('f-vendor').value.trim();
      const amount = parseFloat(document.getElementById('f-amount').value);
      const method = document.querySelector('#f-method-group .pill.active')?.dataset.value || allPaymentMethodOptions()[0];
      const category = document.querySelector('#f-category-group .pill.active')?.dataset.value || (state.settings.categories||[])[0];
      const notes = document.getElementById('f-notes').value.trim();
      if(!vendor || isNaN(amount)) return;
      const btn = document.getElementById('add-submit-btn');
      btn.disabled = true; btn.textContent = 'Saving…';
      try{
        if(method === 'Afterpay'){
          const cardSelect = document.getElementById('f-afterpay-card');
          const cardName = cardSelect ? cardSelect.value : null;
          if(!cardName){
            showToast('Add a credit card first — Afterpay needs one to charge to', true);
            btn.disabled = false; btn.textContent = 'Save transaction';
            return;
          }
          const groupId = uid();
          const installments = afterpayInstallments(amount, date).map((inst,i)=>({
            date: inst.date,
            vendor,
            amount: inst.amount,
            paymentMethod: cardName,
            category,
            notes: (notes ? notes + ' \u00b7 ' : '') + `Afterpay installment ${i+1} of 4 (purchased ${date}, total ${fmtMoney(amount)}) [apg:${groupId}]`,
            reconciled: false
          }));
          const data = await apiPost('addTransactions', { data: installments });
          applyData(data);
          await upsertMerchantFromEntry(vendor, category, 'Afterpay');
          showToast('Split into 4 Afterpay installments');
        } else {
          const data = await apiPost('addTransaction', { data: { date, vendor, amount, paymentMethod: method, category, notes, reconciled:false } });
          applyData(data);
          await upsertMerchantFromEntry(vendor, category, method);
          showToast('Transaction saved');
        }
        setView('log');
      }catch(err){
        setSync('bad');
        showToast('Could not save — check your connection', true);
        btn.disabled = false; btn.textContent = 'Save transaction';
      }
    });
  }

  if(currentView === 'log'){
    document.querySelectorAll('.txn-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        const id = item.dataset.id;
        document.getElementById('view').innerHTML = viewEditTxn(id);
        attachEditHandlers(id);
      });
    });
  }

  if(currentView === 'reconcile'){
    document.querySelectorAll('.recon-check').forEach(cb=>{
      cb.addEventListener('change', async ()=>{
        const t = state.transactions.find(x=>String(x.id)===cb.dataset.id);
        if(!t) return;
        t.reconciled = cb.checked;
        try{
          const data = await apiPost('updateTransaction', { data: t });
          applyData(data);
          render();
        }catch(err){
          setSync('bad');
          showToast('Could not sync that change', true);
        }
      });
    });
    document.querySelectorAll('.actual-input').forEach(inp=>{
      inp.addEventListener('input', ()=> updateVarianceDisplay(inp.dataset.card, inp.dataset.period));
      updateVarianceDisplay(inp.dataset.card, inp.dataset.period);
    });
    document.querySelectorAll('.close-period-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const cardId = btn.dataset.card;
        const key = btn.dataset.period;
        const pid = cardId + '__' + key;
        const input = document.getElementById('actual-'+pid);
        const actual = parseFloat(input.value);
        const cardPeriods = (state.settings.periods||{})[cardId] || {};
        const isClosed = cardPeriods[key] && cardPeriods[key].closed;
        const periods = Object.assign({}, state.settings.periods);
        periods[cardId] = Object.assign({}, cardPeriods, { [key]: { closed: !isClosed, actualTotal: isNaN(actual)?null:actual } });
        try{
          const data = await apiPost('saveSettings', { data: { periods } });
          applyData(data);
          showToast(isClosed ? 'Period reopened' : 'Period marked reconciled');
          render();
        }catch(err){
          setSync('bad');
          showToast('Could not sync that change', true);
        }
      });
    });
  }

  if(currentView === 'settings'){
    document.getElementById('do-transfer-btn').addEventListener('click', async ()=>{
      const from = document.getElementById('tr-from').value;
      const to = document.getElementById('tr-to').value;
      const amount = parseFloat(document.getElementById('tr-amount').value);
      const date = document.getElementById('tr-date').value;
      const notes = document.getElementById('tr-notes').value.trim();
      if(!from || !to || from === to){ showToast('Pick two different sides to transfer between', true); return; }
      if(isNaN(amount) || amount <= 0){ showToast('Enter a valid amount', true); return; }
      const btn = document.getElementById('do-transfer-btn');
      btn.disabled = true; btn.textContent = 'Transferring…';
      try{
        await ensureTransferCategory();
        const txns = [];
        if(hasLedger(from)){
          txns.push({ date, vendor: `Transfer to ${to}`, amount, paymentMethod: from, category: TRANSFER_CATEGORY, notes, reconciled:false });
        }
        if(hasLedger(to)){
          txns.push({ date, vendor: `Transfer from ${from}`, amount: -amount, paymentMethod: to, category: TRANSFER_CATEGORY, notes, reconciled:false });
        }
        if(txns.length){
          const data = await apiPost('addTransactions', { data: txns });
          applyData(data);
          showToast('Transfer recorded');
        } else {

function attachEditHandlers(id){
  document.getElementById('cancel-edit-btn').addEventListener('click', ()=>{
    setView('log');
  });
  document.querySelectorAll('#ef-method-group .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#ef-method-group .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
    });
  });
  document.querySelectorAll('#ef-category-group .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#ef-category-group .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
    });
  });
  document.getElementById('edit-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const t = state.transactions.find(x=>String(x.id)===String(id));
    if(!t) return;
    const updated = {
      id: t.id,
      date: document.getElementById('ef-date').value,
      vendor: document.getElementById('ef-vendor').value.trim(),
      amount: parseFloat(document.getElementById('ef-amount').value),
      paymentMethod: document.querySelector('#ef-method-group .pill.active')?.dataset.value || t.paymentMethod,
      category: document.querySelector('#ef-category-group .pill.active')?.dataset.value || t.category,
      notes: document.getElementById('ef-notes').value.trim(),
      reconciled: t.reconciled
    };
    try{
      const data = await apiPost('updateTransaction', { data: updated });
      applyData(data);
      showToast('Transaction updated');
      setView('log');
    }catch(err){ setSync('bad'); showToast('Could not save', true); }
  });
  document.getElementById('delete-txn-btn').addEventListener('click', async ()=>{
    if(!confirmDelete('Delete this transaction? This can\'t be undone.')) return;
    try{
      const data = await apiPost('deleteTransaction', { id });
      applyData(data);
      showToast('Transaction deleted');
      setView('log');
    }catch(err){ setSync('bad'); showToast('Could not delete', true); }
  });
}

/* ============ Boot ============ */
function renderSetupScreen(){
  document.getElementById('bottom-nav').style.display = 'none';
  document.getElementById('view').innerHTML = `
    <div class="setup-screen">
      <h2 style="margin-bottom:10px;">Connect your Google Sheet</h2>
      <p class="helptext" style="font-size:13px;margin-bottom:16px;">This app stores everything in a Google Sheet, the same way TICKR does. One-time setup:</p>
      <ol>
        <li>Create a new Google Sheet.</li>
        <li>Extensions → Apps Script, paste in <code>Code.gs</code>.</li>
        <li>Deploy → New deployment → Web app. Execute as <code>Me</code>, access <code>Anyone</code>.</li>
        <li>Copy the URL ending in <code>/exec</code> and paste it below.</li>
      </ol>
      <label for="setup-api-url">Apps Script web app URL</label>
      <input type="url" id="setup-api-url" placeholder="https://script.google.com/macros/s/…/exec">
      <button class="btn" id="setup-connect-btn">Connect</button>
      <div id="setup-error" class="helptext" style="color:var(--alert);margin-top:10px;"></div>
    </div>
  `;
  document.getElementById('setup-connect-btn').addEventListener('click', async ()=>{
    const url = document.getElementById('setup-api-url').value.trim();
    const errEl = document.getElementById('setup-error');
    if(!url){ errEl.textContent = 'Paste the /exec URL first.'; return; }
    setApiUrl(url);
    errEl.textContent = 'Connecting…';
    try{
      await refreshFromApi();
      location.reload();
    }catch(err){
      errEl.textContent = "Couldn't reach that URL — check it's deployed with access set to Anyone.";
    }
  });
}

/* ============ PWA install (manifest + service worker) ============ */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* offline shell just won't be available */ });
  });
}

(async function boot(){
  if(!API_URL){
    renderSetupScreen();
    return;
  }
  document.getElementById('bottom-nav').style.display = 'flex';
  document.querySelector('.nav-btn[data-view="dashboard"]').classList.add('active');
  setSync('busy');
  try{
    await refreshFromApi();
    await migrateLegacyCardIfNeeded();
    await migrateLegacyAccountIfNeeded();
    setSync('ok');
    render();
  }catch(err){
    setSync('bad');
    document.getElementById('view').innerHTML = `<div class="card"><div class="empty">Couldn't reach the Google Sheet.<br>Check the deployment access is set to "Anyone", or update the URL in Settings → Data source.</div></div>`;
  }
})();
</script>
